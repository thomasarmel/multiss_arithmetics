[package]
name = "arithmetics"
version = "0.1.0"
edition = "2021"

[features]
default = ["malachite"]
rug = ["dep:rug"]
malachite = ["dep:malachite"]
bigint = ["dep:num-bigint"]

[dev-dependencies]
criterion = "0.8.1"

[[bench]]
name = "shamir_lagrange"
harness = false

[dependencies]
# Serialization
serde = { version = "1.0.228", features = ["derive"] }

# Math
num-bigint = { version = "0.4.6", optional = true }
rug = { version = "1.27.0", optional = true }
malachite = { version = "0.9.0", features = ["random"], optional = true }
rand = "0.9.2"

# Crypto
rand_chacha = "0.9.0"

# Misc
snafu = "0.8.9"

# Parallelism and concurrency
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
rayon = "1.10.0"
tracing = "0.1.43"
